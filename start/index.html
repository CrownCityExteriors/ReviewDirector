<!DOCTYPE html>
<html>
<head>
    <!-- Keep the browser title simple and professional -->
    <title>Connecting... | Crown City Exteriors</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Essential Social Media Preview Tags (Keep these, don't change) -->
    <meta property="og:title" content="Leave a Review for Crown City Exteriors" />
    <meta property="og:description" content="We appreciate your business! Tap here to leave us a quick review." />
    <meta property="og:image" content="https://crowncityexteriors.github.io/ReviewDirector/start/preview.jpg" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Leave a Review for Crown City Exteriors" />
    <meta name="twitter:description" content="We appreciate your business! Tap here to leave us a quick review." />
    <meta name="twitter:image" content="https://crowncityexteriors.github.io/ReviewDirector/start/preview.jpg" />

    <!-- Style: Branding the loading page -->
    <style>
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            text-align: center; 
            margin: 0; 
            padding: 0; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            color: #333; 
            background-color: #f9f9f9; 
        }
        .container { 
            padding: 20px; 
        }
        /* Style your image (rounds the corners, limits size) */
        .brand-image {
            max-width: 250px; /* limits width so it looks good on mobile */
            height: auto;
            border-radius: 12px;
            margin-bottom: 25px;
            /* Added a subtle shadow to make it pop */
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        h2 { 
            font-weight: 600; 
            margin: 0 0 10px 0;
            color: #222;
        }
        p {
            margin: 0;
            color: #666;
            font-size: 0.9rem;
        }
        /* Animation CSS for fading dots */
        .dots {
            display: inline-block;
        }
        .dots span {
            /* Fades dots from invisible (0) to visible (1) and back */
            animation: fadeDots 1.4s infinite both;
            opacity: 0;
            font-weight: bold;
        }
        /* Adds the left-to-right delay effect */
        .dots span:nth-child(1) { animation-delay: 0.0s; }
        .dots span:nth-child(2) { animation-delay: 0.2s; }
        .dots span:nth-child(3) { animation-delay: 0.4s; }

        @keyframes fadeDots {
            0%, 100% { opacity: 0; }
            50% { opacity: 1; }
        }
    </style>

    <script>
        // Instantly redirect humans to your Zite app (Keep this, don't change)
        window.location.replace("https://crowncityexteriorsreviews.zite.so");
    </script>
</head>
<body>
    <div class="container">
        <!-- Loads your preview.jpg file from the same folder -->
        <img src="preview.jpg" alt="Crown City Exteriors Logo" class="brand-image">
        
        <!-- Fancified Text Message -->
        <h2>Connecting you</h2>
        <p>Just a moment<span class="dots"><span>.</span><span>.</span><span>.</span></span></p>
    </div>
</body>
</html>
