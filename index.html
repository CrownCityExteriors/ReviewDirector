<!DOCTYPE html>
<html>
<head>
    <title>Loading Reviews...</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; text-align: center; padding-top: 30%; color: #333; }
    </style>
    <script>
        var ua = navigator.userAgent || navigator.vendor || window.opera;
        
        if (/android/i.test(ua)) {
            // ANDROID: Must execute INSTANTLY to preserve the user tap token, 
            // which Chrome requires to allow the intent:// command to fire.
            var intentUrl = "intent://m.facebook.com/crowncityexteriors/reviews/#Intent;scheme=https;package=com.android.chrome;S.browser_fallback_url=https%3A%2F%2Fm.facebook.com%2Fcrowncityexteriors%2Freviews%2F;end";
            window.location.replace(intentUrl);
        } else {
            // iOS: Must be DELAYED to kill the user tap token. 
            // Without the token, iOS refuses to launch the Facebook app and forces the web browser.
            setTimeout(function() {
                window.location.replace("https://m.facebook.com/crowncityexteriors/reviews/");
            }, 1500); // 1.5 second delay
        }
    </script>
</head>
<body>
    <h2>Loading Reviews...</h2>
    <p>Please wait a moment.</p>
</body>
</html>
