<!DOCTYPE html>
<html>
<head>
    <title>Loading Reviews... | Crown City Exteriors</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            text-align: center; 
            margin: 0; 
            padding: 0; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            color: #333; 
            background-color: #f9f9f9; 
        }
        .container { 
            padding: 20px; 
        }
        .brand-image {
            max-width: 250px; 
            height: auto;
            border-radius: 12px;
            margin-bottom: 25px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        h2 { 
            font-weight: 600; 
            margin: 0 0 10px 0;
            color: #222;
        }
        p {
            margin: 0;
            color: #666;
            font-size: 0.9rem;
        }
        .dots { display: inline-block; }
        .dots span {
            animation: fadeDots 1.4s infinite both;
            opacity: 0;
            font-weight: bold;
        }
        .dots span:nth-child(1) { animation-delay: 0.0s; }
        .dots span:nth-child(2) { animation-delay: 0.2s; }
        .dots span:nth-child(3) { animation-delay: 0.4s; }

        @keyframes fadeDots {
            0%, 100% { opacity: 0; }
            50% { opacity: 1; }
        }
    </style>
    <script>
        var isAndroid = false;

        if (navigator.userAgentData) {
            isAndroid = navigator.userAgentData.platform === "Android";
        } else {
            var ua = navigator.userAgent || navigator.vendor || window.opera;
            isAndroid = /android/i.test(ua);
        }

        if (isAndroid) {
            // ANDROID: We removed the brute-force intent link. 
            // Now, we just feed it the clean profile URL. When newer Androids 
            // hijack this into the native Facebook app, it will safely land on 
            // your business page instead of the home feed.
            window.location.replace("https://www.facebook.com/crowncityexteriors");
        } else {
            // iOS / OTHERS: We keep your brilliant /login/ bypass method.
            // This preserves the flawless direct-to-review-tab experience for iPhones.
            window.location.replace("https://www.facebook.com/login/?next=https%3A%2F%2Fm.facebook.com%2Fcrowncityexteriors%2Freviews%2F");
        }
    </script>
</head>
<body>
    <div class="container">
        <img src="https://crowncityexteriors.github.io/ReviewDirector/start/preview.jpg" alt="Crown City Exteriors" class="brand-image">
        <h2>Loading Reviews</h2>
        <p>Please wait a moment<span class="dots"><span>.</span><span>.</span><span>.</span></span></p>
    </div>
</body>
</html>
